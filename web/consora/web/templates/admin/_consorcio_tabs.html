{# Pestañas de las actividades de un consorcio. Recibe c (consorcio) y activa. #}
<div class="consorcio-tabs">
    <a href="{% url 'consorcio_facturas' c.id_consorcio %}"{% if activa == 'facturas' %} class="active"{% endif %}><i class="bi bi-receipt"></i> Facturación</a>
    <a href="{% url 'contratos' %}?consorcio={{ c.id_consorcio }}"{% if activa == 'contratos' %} class="active"{% endif %}><i class="bi bi-file-earmark-text"></i> Contratos</a>
    <a href="{% url 'votaciones' %}?consorcio={{ c.id_consorcio }}"{% if activa == 'votaciones' %} class="active"{% endif %}><i class="bi bi-check2-square"></i> Votaciones</a>
    <a href="{% url 'reuniones' %}?consorcio={{ c.id_consorcio }}"{% if activa == 'reuniones' %} class="active"{% endif %}><i class="bi bi-camera-video"></i> Reuniones</a>
    <a href="{% url 'historial_consorcios' %}?consorcio={{ c.id_consorcio }}"{% if activa == 'historial' %} class="active"{% endif %}><i class="bi bi-clock-history"></i> Historial</a>
</div>
